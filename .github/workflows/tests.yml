name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        # LFS content is intentionally NOT fetched; slow tests skip without it.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install poetry
        run: pipx install poetry
      - name: Install package with test dependencies
        run: poetry install --with test --extras "viz io"
      - name: Run fast test suite
        run: poetry run pytest -q -p no:cacheprovider
